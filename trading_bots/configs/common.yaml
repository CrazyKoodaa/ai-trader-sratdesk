# configs/common.yaml — Basis-Konfiguration (Pfade, Kosten je Symbol, Zeitzonen)
# Wird von scripts/run_backtest.py / run_wfa.py als --common geladen.
# Strategie-Configs duerfen Werte ueberschreiben (Merge in run_backtest).

paths:
  data_dir: data
  reports_dir: reports
  logs_dir: logs
  news_cache: data/news
  dukascopy_cache: data/dukascopy_cache

# Zeitzone-Defaults (SPEC §1: intern IMMER UTC tz-aware; Sessions via zoneinfo)
timezone:
  internal: UTC
  session_new_york: America/New_York
  session_london: Europe/London
  server_day_offset_hours: 0        # Server-Tag = UTC-Tag + Offset (Backtest-Konvention)
  weekend_close_fri_hour_utc: 21    # Gap-Audit: Fr 21:00 UTC - So 21:00 UTC geschlossen
  weekend_open_sun_hour_utc: 21

# Kosten je Symbol (Defaults — Backtest-Kostenmodell ist IMMER aktiv, SPEC §1)
# point_value: Wert einer 1.0-Preisbewegung je 1.0 Lot in QUOTIERUNGS-Waehrung
#   (Standard-Lot 100k Basis / 100 oz Gold). point_value x account_ccy_rate
#   ergibt den Wert in Kontowaehrung (USD). Statische Naeherungsraten
#   (Stand 2026-09): JPY 0.0067, CHF 1.13, CAD 0.74.
# spread_points: typischer Spread in MT5-Punkten (point = kleinste Preiseinheit)
symbols:
  XAUUSD:
    point: 0.01
    digits: 2
    point_value: 100.0            # 1 Lot = 100 oz -> 100 USD je 1.0 Preisbewegung
    spread_points: 35             # ~0.35 USD
    commission_per_lot_rt: 0.0
    swap_long_pts: -40.0
    swap_short_pts: 20.0
    triple_swap_weekday: 2
    volume_step: 0.01
  # Nachfolgend: Silber/Platin/Palladium, live von MT5 abgefragt
  # (core.connector.symbol_info/symbol_info_tick, s. reports/... Portfolio-
  # Pooling-Untersuchung) -- point_value = contract_size (wie bei XAUUSD:
  # $ je 1.0 Preisbewegung x 1 Lot), spread_points aus Live-Snapshot
  # Bid/Ask, swap direkt aus MT5 (swap_mode=1 = Punkte, keine Umrechnung
  # noetig).
  XAGUSD:
    point: 0.001
    digits: 3
    point_value: 5000.0           # 1 Lot = 5000 oz
    spread_points: 66             # Live-Snapshot ~0.066 USD
    commission_per_lot_rt: 0.0
    swap_long_pts: -2.3
    swap_short_pts: 0.2
    triple_swap_weekday: 2
    volume_step: 0.01
  XPTUSD:
