# sl_atr_mult 3.0/3.5/4.0, trail_atr_mult fix 4.0 -- durchgehend
# dominant seit S9j) aufzugeben.
strategy: s9_donchian_trend
symbols:
  - XAUUSD
timeframes: [H1]

risk:
  risk_per_trade_pct: 0.5
  daily_loss_halt_pct: 0.0
  eod_flat: false
  friday_flat: false
  max_concurrent: 1
  streak_limiter: 0
  prop_profile: none

params:
  primary_tf: H1
  don_len: 400
  atr_len: 14
  sl_atr_mult: 3.5
  trail_atr_mult: 4.0
  min_rr: 2.0
  risk_pct: 0.0045
  adx_min: 20.0

wfo:
  is_months: 24
  oos_months: 6
  param_space:
    don_len: [300, 400, 500]
    sl_atr_mult: [3.0, 3.5, 4.0]
    adx_min: [15.0, 20.0, 25.0]
