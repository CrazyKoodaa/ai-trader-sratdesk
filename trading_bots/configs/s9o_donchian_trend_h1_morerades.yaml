# S9o — S9n (reports/wfa_s9n_donchian_xauusd_h1_leaner) war die bisher
# staerkste XAUUSD-Kandidatur der ganzen Session: PF(1x)=1.579 PASS (der
# ERSTE PF(1x)-Pass ueberhaupt in dieser Session), PF(2x)/PF(3x) PASS,
# DSR=0.929 (naeher an 0.95 als je zuvor), MC-DD=5.47% PASS -- aber
# n(OOS)=291, knapp 9 Trades UNTER der 300er-Schwelle (Gate-Fail), und
# PBO auf 0.529 gesprungen (schlechter als S9l).
#
# Dieser Lauf holt don_len=300 zurueck ins Grid (in S9j/S9k mehrfach
