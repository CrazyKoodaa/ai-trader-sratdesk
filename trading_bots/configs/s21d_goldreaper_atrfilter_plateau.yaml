# S21d — wie s21c_goldreaper_atrfilter.yaml, zusaetzlich mit
# wfo.selection: plateau (core/validation.py::_select_best_params, SPEC
# §4.9 "Plateau-Selektion statt Max-PF"). s21c attackiert PF(1x) und
# MC-MaxDD (ATR-Vol-Filter im WFO-Grid + reduziertes Risiko/Concurrent);
# dieser Lauf testet zusaetzlich, ob Plateau- statt Max-PF-Selektion pro
# Fold das PBO/CSCV-Gate (chronisch hoechster Fail bei S21: 0.34 in mc5/
# Original) senkt, indem Parameter-Regionen mit stabiler statt isolierter
# IS-Performance bevorzugt werden -- genau der Mechanismus, den CSCV als
# Overfitting bestraft.
strategy: s21_goldreaper_momentum_stack
symbols:
  - XAUUSD
timeframes: [H1]

risk:
  risk_per_trade_pct: 0.3
  daily_loss_halt_pct: 0.0
  eod_flat: false
  friday_flat: false
  max_concurrent: 4
  streak_limiter: 0
  prop_profile: none

params:
  primary_tf: H1
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi_len: 14
  rsi_min: 60.0
  require_mid_slow_align: true
  require_cross: true
  atr_len: 14
  atr_vol_min_percentile: 0.0
  sl_atr_mult: 2.0
  trail_atr_mult: 3.0
  min_rr: 2.0
  risk_pct: 0.0025

wfo:
  is_months: 24
  oos_months: 6
  selection: plateau
  param_space:
    rsi_min: [55, 60, 65]
    sl_atr_mult: [1.5, 2.0]
    min_rr: [1.5, 2.0]
    atr_vol_min_percentile: [0.0, 0.2, 0.4]
