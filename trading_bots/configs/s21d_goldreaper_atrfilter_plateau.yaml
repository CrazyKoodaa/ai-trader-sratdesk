# S21d — wie s21c_goldreaper_atrfilter.yaml (ATR-Vol-Filter als WFO-Param,
# reduziertes Risiko/max_concurrent), zusaetzlich wfo.selection: plateau.
#
# Motivation: core/validation.py::walk_forward hat bisher IMMER reines
# Max-IS-PF fuer die Fold-Parameterwahl genutzt, obwohl plateau_select()
# (SPEC §4.9 "Plateau-Selektion statt Max-PF") implementiert und getestet
# war, aber nirgends aufgerufen wurde (s. Commit "Wire up plateau-selection
# in WFA fold selector"). Max-PF waehlt bevorzugt eine einzelne rauschende
# IS-Spitze -- genau das Muster, das PBO/CSCV bestraft. Alle bisherigen
# XAUUSD-Kandidaten dieser Session (inkl. s21/s21_mc5, PBO 0.343) scheitern
# am PBO<0.10-Gate. Diese Variante testet, ob Plateau-Selektion (>=60%
# positive IS-Nachbarzellen) die Parameterwahl stabiler macht und damit das
# PBO-Gate faellt, bei ansonsten identischem Setup zu s21c.
#
# NACHTRAG: dieselbe Datei wurde parallel in zwei Sitzungen angelegt (Sandbox-
# und lokale Fortsetzung derselben Session, dieser Merge fuehrt beide
# Fassungen zusammen — inhaltlich identisch bis auf den Kommentarkopf).
# Ausserdem: die urspruengliche plateau_select-Anbindung hatte einen
# Degenerations-Bug bei PF-Metriken (immer >=0 -> "positive Nachbarn" war
# trivial erfuellt, s. Commit "Fix plateau-selection degeneration fuer
# PF-Metrik") -- s21c und s21d lieferten dadurch bit-identische Ergebnisse.
# Mit dem Fix und echten Broker-Daten (data_mt5, 2015-2026, s.
# reports/wfa_s21c_goldreaper_atrfilter_mt5 und
# .../wfa_s21d_goldreaper_atrfilter_plateau_mt5) schneidet der ATR-Filter
# durchgehend SCHLECHTER ab als die unveraenderte mc5-Baseline (PF 1.26 vs.
# 1.42, PBO 0.46 vs. 0.34, MC-DD 9.94% vs. 8.93%) -- die Post-Hoc-ATR-
# Quintil-Beobachtung generalisiert nicht kausal. s21e isoliert die
# Plateau-Selektion (ohne ATR-Filter-Grid) gegen dieselbe Baseline.
strategy: s21_goldreaper_momentum_stack
symbols:
  - XAUUSD
timeframes: [H1]

risk:
  risk_per_trade_pct: 0.3
  daily_loss_halt_pct: 0.0
  eod_flat: false
  friday_flat: false
  max_concurrent: 4
  streak_limiter: 0
  prop_profile: none

params:
  primary_tf: H1
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi_len: 14
  rsi_min: 60.0
  require_mid_slow_align: true
  require_cross: true
  atr_len: 14
  atr_vol_min_percentile: 0.0
  sl_atr_mult: 2.0
  trail_atr_mult: 3.0
  min_rr: 2.0
  risk_pct: 0.0025

wfo:
  is_months: 24
  oos_months: 6
  selection: plateau
  param_space:
    rsi_min: [55, 60, 65]
    sl_atr_mult: [1.5, 2.0]
    min_rr: [1.5, 2.0]
    atr_vol_min_percentile: [0.0, 0.2, 0.4]
