# S21 — Aus der echten Trade-Historie von "Gold Reaper New V2 2" (MQL5
# Signal #2265877, 855 Trades) rekonstruiertes EMA-Stack-Momentum-System.
# s. strategies/s21_goldreaper_momentum_stack.py fuer die volle Herleitung
# (Verhaltens-Reverse-Engineering, kein Bytecode/keine Produktseite als
# Quelle). Vorab-Triage (Voll-Historie, 12 Kombos nach Cross-Event-Fix):
# PF 1.24-1.45 durchgehend, konsistentestes Ergebnis der ganzen Session.
strategy: s21_goldreaper_momentum_stack
symbols:
  - XAUUSD
timeframes: [H1]

risk:
  risk_per_trade_pct: 0.3
  daily_loss_halt_pct: 0.0
  eod_flat: false
  friday_flat: false
  max_concurrent: 10       # Strategie stapelt bewusst mehrere Positionen (Original: bis zu 13 beobachtet)
  streak_limiter: 0
  prop_profile: none

params:
  primary_tf: H1
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi_len: 14
  rsi_min: 60.0
  require_mid_slow_align: true
  require_cross: true
  atr_len: 14
  atr_vol_min_percentile: 0.0
  sl_atr_mult: 2.0
  trail_atr_mult: 3.0
  min_rr: 2.0
  risk_pct: 0.003

wfo:
  is_months: 24
  oos_months: 6
  param_space:
    rsi_min: [55, 60, 65]
    sl_atr_mult: [1.5, 2.0]
    min_rr: [1.5, 2.0]
