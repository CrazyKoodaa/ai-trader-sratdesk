# S21g — wie s21f_goldreaper_smallgrid_plateau.yaml (kleineres 6-Kombo-
# Grid: rsi_min x sl_atr_mult, min_rr fix 2.0, risk_pct 0.0028), aber
# selection: pf (Default/Max-PF) statt plateau. Kontrollarm: isoliert, ob
# die (erwartete) PBO-Verbesserung vom kleineren Grid kommt oder von der
# Plateau-Selektion -- 2x2-Vergleich mit s21e (12 Kombos, plateau) und der
# mc5-Baseline (12 Kombos, pf).
strategy: s21_goldreaper_momentum_stack
symbols:
  - XAUUSD
timeframes: [H1]

risk:
  risk_per_trade_pct: 0.3
  daily_loss_halt_pct: 0.0
  eod_flat: false
  friday_flat: false
  max_concurrent: 5
  streak_limiter: 0
  prop_profile: none

params:
  primary_tf: H1
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi_len: 14
  rsi_min: 60.0
  require_mid_slow_align: true
  require_cross: true
  atr_len: 14
  atr_vol_min_percentile: 0.0
  sl_atr_mult: 2.0
  trail_atr_mult: 3.0
  min_rr: 2.0
  risk_pct: 0.0028

wfo:
  is_months: 24
  oos_months: 6
  param_space:
    rsi_min: [55, 60, 65]
    sl_atr_mult: [1.5, 2.0]
