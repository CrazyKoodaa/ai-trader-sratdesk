# S9n — leaneres, konvergiertes Grid nach S9l (korrigiert,
# reports/wfa_s9l_donchian_xauusd_h1_final_riskfixed: 7/10, n=304 knapp
# ueber der 300-Schwelle, DSR=0.61, PBO=0.386). adx_min=25 (obere
# Grid-Grenze) gewann 13/20 Folds in S9l -- der ADX-Filter ist der
# staerkste Trade-Count-Reduzierer der ganzen Kette (963->543->436->332
# -> 304 ueber S9h..S9l). Ziel dieses Laufs: mehr Trades (bessere DSR-
# Praezision, mehr Puffer ueber der n>=300-Schwelle) OHNE die
# Qualitaetsgewinne zurueckzugeben -- durch (a) einen dritten, feineren
# adx_min-Wert (15) UND (b) ein insgesamt kleineres Grid (trail_atr_mult
# auf den durchgehend dominanten Wert 4.0 fixiert, don_len auf die zwei
# konsistent guten Werte 400/500 reduziert) -- weniger Kombos senkt
# gleichzeitig die DSR-n_trials-Straf-Groesse (SPEC §7.4) UND die
# PBO-Ueberanpassungs-Flaeche.
strategy: s9_donchian_trend
symbols:
  - XAUUSD
timeframes: [H1]

risk:
  risk_per_trade_pct: 0.5
  daily_loss_halt_pct: 0.0
  eod_flat: false
  friday_flat: false
  max_concurrent: 1
  streak_limiter: 0
  prop_profile: none

params:
  primary_tf: H1
  don_len: 400
  atr_len: 14
  sl_atr_mult: 3.5
  trail_atr_mult: 4.0
  min_rr: 2.0
  risk_pct: 0.0045
  adx_min: 20.0

wfo:
  is_months: 24
  oos_months: 6
  param_space:
    don_len: [400, 500]
    sl_atr_mult: [3.0, 3.5, 4.0]
    adx_min: [15.0, 20.0, 25.0]
