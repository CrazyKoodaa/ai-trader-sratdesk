# S21b — wie s21_goldreaper_momentum_stack.yaml, aber max_concurrent von
# 10 auf 5 reduziert. Ziel: pruefen ob das MC p95-MaxDD-Gate (Original:
# 8.93% vs. 8.0%-Schwelle, knappester Miss der Session) dadurch faellt,
# da die Original-WFA 7/10 Gates bestand und DSR=1.000 lieferte (s.
# reports/wfa_s21_goldreaper_xauusd.log).
strategy: s21_goldreaper_momentum_stack
symbols:
  - XAUUSD
timeframes: [H1]

risk:
  risk_per_trade_pct: 0.3
  daily_loss_halt_pct: 0.0
  eod_flat: false
  friday_flat: false
  max_concurrent: 5        # reduziert von 10
  streak_limiter: 0
  prop_profile: none

params:
  primary_tf: H1
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi_len: 14
  rsi_min: 60.0
  require_mid_slow_align: true
  require_cross: true
  atr_len: 14
  atr_vol_min_percentile: 0.0
  sl_atr_mult: 2.0
  trail_atr_mult: 3.0
  min_rr: 2.0
  risk_pct: 0.003

wfo:
  is_months: 24
  oos_months: 6
  param_space:
    rsi_min: [55, 60, 65]
    sl_atr_mult: [1.5, 2.0]
    min_rr: [1.5, 2.0]
