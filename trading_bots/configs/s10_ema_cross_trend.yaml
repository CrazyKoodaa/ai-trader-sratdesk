# S10 — EMA-Cross-Trendfolge (symbol-agnostisch, H4)
# Doppel-EMA-Crossover + ATR-Trailing-Stop, kein festes TP. Symbol via
# --symbol, Kostenmodell faellt auf configs/common.yaml zurueck.
strategy: s10_ema_cross_trend
symbols:
  - XAUUSD
timeframes: [H4]

risk:
  risk_per_trade_pct: 0.5
  daily_loss_halt_pct: 0.0
  eod_flat: false
  friday_flat: false
  max_concurrent: 1
  streak_limiter: 0
  prop_profile: none

params:
  primary_tf: H4
  ema_fast: 20
  ema_slow: 55
  atr_len: 14
  sl_atr_mult: 2.0
  trail_atr_mult: 3.0
  min_rr: 2.0                # Mindest-RR; TP wird bei Beruehrung zur Trail-Aktivierung (Move-to-Trail)
  risk_pct: 0.005

wfo:
  is_months: 24
  oos_months: 6
  param_space:
    ema_fast: [10, 20, 30]
    ema_slow: [40, 55, 80]
    sl_atr_mult: [1.5, 2.0, 2.5]
    trail_atr_mult: [2.0, 3.0, 4.0]
