# S21e — isolierter Test von wfo.selection: plateau. IDENTISCH zu
# s21_goldreaper_momentum_stack_mc5.yaml (kein ATR-Filter, kein
# Risiko-/max_concurrent-Aenderung) bis auf die eine Zeile
# `selection: plateau` -- damit die Wirkung der Plateau-Selektion
# (core/validation.py::_select_best_params, SPEC §4.9) isoliert vom
# ATR-Filter-Experiment (s21c/s21d, das auf einem separaten, groesseren
# 4D-Grid schlechter abschnitt als der 3D-mc5-Baseline) gemessen werden
# kann. Mc5-Baseline auf data_mt5 (n=1173, PBO=0.343, PF=1.424, DSR=1.000,
# MC-DD=8.93%, 7/10 Gates) ist der Vergleichspunkt.
strategy: s21_goldreaper_momentum_stack
symbols:
  - XAUUSD
timeframes: [H1]

risk:
  risk_per_trade_pct: 0.3
  daily_loss_halt_pct: 0.0
  eod_flat: false
  friday_flat: false
  max_concurrent: 5
  streak_limiter: 0
  prop_profile: none

params:
  primary_tf: H1
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi_len: 14
  rsi_min: 60.0
  require_mid_slow_align: true
  require_cross: true
  atr_len: 14
  atr_vol_min_percentile: 0.0
  sl_atr_mult: 2.0
  trail_atr_mult: 3.0
  min_rr: 2.0
  risk_pct: 0.003

wfo:
  is_months: 24
  oos_months: 6
  selection: plateau
  param_space:
    rsi_min: [55, 60, 65]
    sl_atr_mult: [1.5, 2.0]
    min_rr: [1.5, 2.0]
